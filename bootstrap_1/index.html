<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CIELO Official</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">CIELO</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#hoodies">Hoodies</a></li>
        <li class="nav-item"><a class="nav-link" href="#shirts">Shirts</a></li>
        <li class="nav-item"><a class="nav-link" href="#shorts">Shorts</a></li>
        <li class="nav-item"><a class="nav-link" href="#cart">Cart</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HOME -->
<section id="home" class="text-center text-white d-flex align-items-center justify-content-center"
  style="height:100vh; background:#384959;">
  <div>
    <h1 style="font-size:80px;">CIELO</h1>
    <p>Feel better. Wear better.</p>
    <a href="#hoodies" class="btn btn-light mt-3">Shop Now</a>
  </div>
</section>

<!-- HOODIES -->
<section id="hoodies" class="py-5">
  <div class="container">
    <h2 class="mb-4">HOODIES</h2>
    <div class="row g-4">

      <div class="col-md-4">
        <div class="card">
          <img src="https://img.hollisterco.com/is/image/anf/KIC_322-5147-00465-901_model1?policy=product-medium">
          <div class="card-body">
            <h5>Boxy Hoodie</h5>
            <p>$40</p>
            <button class="btn btn-dark checkout-btn" data-name="Boxy Hoodie" data-price="40">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <img src="https://img.hollisterco.com/is/image/anf/KIC_322-6139-00076-109_model1?policy=product-medium">
          <div class="card-body">
            <h5>Camo Hoodie</h5>
            <p>$45</p>
            <button class="btn btn-dark checkout-btn" data-name="Camo Hoodie" data-price="45">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- SHIRTS -->
<section id="shirts" class="py-5 bg-light">
  <div class="container">
    <h2 class="mb-4">SHIRTS</h2>
    <div class="row g-4">

      <div class="col-md-4">
        <div class="card">
          <img src="https://image.hm.com/assets/hm/99/6b/996b8b3f6c3fbf7877c0aab9452c991fc645b54b.jpg?imwidth=2160">
          <div class="card-body">
            <h5>Loose Tee</h5>
            <p>$10</p>
            <button class="btn btn-dark checkout-btn" data-name="Loose Tee" data-price="10">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <img src="https://img.hollisterco.com/is/image/anf/KIC_323-5334-00710-101_prod2?policy=product-medium">
          <div class="card-body">
            <h5>Hellcat Jersey</h5>
            <p>$50</p>
            <button class="btn btn-dark checkout-btn" data-name="Hellcat Jersey" data-price="50">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- SHORTS -->
<section id="shorts" class="py-5">
  <div class="container">
    <h2 class="mb-4">SHORTS</h2>
    <div class="row g-4">

      <div class="col-md-4">
        <div class="card">
          <img src="https://img.hollisterco.com/is/image/anf/KIC_328-6086-00156-977_model1?policy=product-medium">
          <div class="card-body">
            <h5>Grey Shorts</h5>
            <p>$44</p>
            <button class="btn btn-dark checkout-btn" data-name="Grey Shorts" data-price="44">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- CART -->
<section id="cart" class="py-5">
  <div class="container">
    <h2>Your Cart</h2>

    <div id="cart-items" class="my-3"></div>
    <h3 id="cart-total">Total: $0</h3>

    <button class="btn btn-success mt-3" onclick="checkout()">Checkout</button>
  </div>
</section>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
