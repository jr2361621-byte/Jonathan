<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CIELO (Official).com</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

<!-- CART ICON -->
<div id="cart-icon" onclick="toggleCart()">
  🛒 (<span id="cart-count">0</span>)
</div>

<!-- CART PANEL -->
<div id="cart">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>
  <h3>Total: $<span id="cart-total">0</span></h3>
  <button onclick="clearCart()">Clear Cart</button>
</div>

  <!-- HOME -->
  <section id="home" class="hero">
    <div class="content">
      <h1>CIELO</h1>
      <p>Feel better. Wear better</p>
      <a href="#shop" class="btn">Shop Now</a>
    </div>
  </section>

  <!-- SHOP -->
  <section id="shop" class="shop">
    <h2>Shop By Category</h2>

    <div class="category-buttons">
      <a href="#hoodies" class="category">Hoodies</a>
      <a href="#shirts" class="category">Shirts</a>
      <a href="#shorts" class="category">Shorts</a>
      <a href="#pants" class="category">Pants</a>
      <a href="#shoes" class="category">Shoes</a>
      <a href="#accessories" class="category">Accessories</a>
    </div>
  </section>

  <!-- HOODIE EXAMPLE -->
  <section id="hoodies" class="shop">
    <a href="#shop" class="back">← Back</a>

    <h2>Hoodies</h2>

    <div class="products">

      <div class="product-card">
        <img src="black_hoodie.png">
        <h3>Hollister Hoodie</h3>
        <p>$40</p>
        <button class="checkout-btn" onclick="addToCart('Hollister Hoodie', 40)">
          Add to Cart
        </button>
      </div>

      <div class="product-card">
        <img src="Untitled design-3.png">
        <h3>Real Madrid Hoodie</h3>
        <p>$45</p>
        <button class="checkout-btn" onclick="addToCart('Real Madrid Hoodie', 45)">
          Add to Cart
        </button>
      </div>

    </div>
  </section>

<script>
let cart = [];

function addToCart(name, price) {
  cart.push({ name, price });
  updateCart();
}

function updateCart() {
  const cartItems = document.getElementById("cart-items");
  const cartCount = document.getElementById("cart-count");
  const cartTotal = document.getElementById("cart-total");

  cartItems.innerHTML = "";
  let total = 0;

  cart.forEach((item, index) => {
    total += item.price;

    const div = document.createElement("div");
    div.innerHTML = `
      ${item.name} - $${item.price}
      <button onclick="removeItem(${index})">X</button>
    `;
    cartItems.appendChild(div);
  });

  cartCount.textContent = cart.length;
  cartTotal.textContent = total;
}

function removeItem(index) {
  cart.splice(index, 1);
  updateCart();
}

function clearCart() {
  cart = [];
  updateCart();
}

function toggleCart() {
  document.getElementById("cart").classList.toggle("active");
}
</script>

</body>
</html>
